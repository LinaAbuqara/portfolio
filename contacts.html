  <header>
    <h1>Ліна Абукаре</h1>
    <nav>
      <ul>

        <li><a href="about.html">Про мене</a></li>

  <main>  

    <h1>Контакти</h1>

    <p>Email: <a href="mailto:l.m.abukare@student.khai.edu">l.m.abukare@student.khai.edu</a></p>
    <p>Телефон: <a href="tel:+380991234567">+38 (099) 123-45-67</a></p>

    <form action="#" method="post">
      <fieldset>
        <legend>Контактна інформація</legend>

        <label for="name">Ім'я:</label>
        <input type="text" id="name" name="name" placeholder="Введіть ваше ім'я" required>


        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="email@example.com" required>

      </fieldset>

      <fieldset>
        <legend>Повідомлення</legend>

        <label for="subject">Тема:</label>
        <select id="subject" name="subject" required>
          <option value="">-- Оберіть тему --</option>
          <option value="general">Загальне питання</option>
          <option value="cooperation">Співпраця</option>
          <option value="feedback">Відгук</option>
        </select>

        <p>Тип звернення:</p>
        <label>
          <input type="radio" name="type" value="question" required> Питання
        </label>
        <label>
          <input type="radio" name="type" value="suggestion"> Пропозиція
        </label>
        <label>
          <input type="radio" name="type" value="complaint"> Скарга
        </label>

        <label for="message">Повідомлення:</label>
        <textarea id="message" name="message" rows="5" placeholder="Ваше повідомлення"></textarea>

      </fieldset>

      <label>
        <input type="checkbox" name="consent" required>
        Я погоджуюсь на обробку персональних даних
      </label>

      <button type="submit">Надіслати</button>
    </form>

	<aside>
      <p>Цікавий факт: це мій перший сайт!</p>  
    </aside>

  </main>

  <footer>

  </footer>

</html>
