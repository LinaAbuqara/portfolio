      <a href="index.html" class="logo">Ліна Абукаре</a>

      </nav>
    </header>

    <aside class="sidebar">
      <div class="card sidebar-card">
        <h3 class="sidebar-title">Звʼязатися</h3>
        <p>Email: <a href="mailto:l.m.abukare@student.khai.edu" class="text-link">l.m.abukare@student.khai.edu</a></p>
        <p>Телефон: <a href="tel:+380991234567" class="text-link">+38 (099) 123-45-67</a></p>
      </div>
    </aside>

    <main class="content">
      <section class="section">
        <h1 class="page-title">Контакти</h1>
        <p>Маєте питання чи пропозицію? Напишіть мені через форму нижче.</p>

        <form action="#" method="post" class="contact-form">
          <fieldset class="form-group">
            <legend>Контактна інформація</legend>

            <label for="name">Імʼя:</label>
            <input type="text" id="name" name="name" placeholder="Введіть ваше імʼя" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="email@example.com" required>
          </fieldset>

          <fieldset class="form-group">
            <legend>Повідомлення</legend>

            <label for="subject">Тема:</label>
            <select id="subject" name="subject" required>
              <option value="">-- Оберіть тему --</option>
              <option value="general">Загальне питання</option>
              <option value="cooperation">Співпраця</option>
              <option value="feedback">Відгук</option>
            </select>

            <p class="field-label">Тип звернення:</p>
            <label class="choice">
              <input type="radio" name="type" value="question" required> Питання
            </label>
            <label class="choice">
              <input type="radio" name="type" value="suggestion"> Пропозиція
            </label>
            <label class="choice">
              <input type="radio" name="type" value="complaint"> Скарга
            </label>

            <label for="message">Повідомлення:</label>
            <textarea id="message" name="message" rows="5" placeholder="Ваше повідомлення"></textarea>
          </fieldset>

          <label class="choice consent">
            <input type="checkbox" name="consent" required>
            Я погоджуюсь на обробку персональних даних
          </label>

          <button type="submit" class="btn">Надіслати</button>
        </form>
      </section>
    </main>

    <footer class="footer">
